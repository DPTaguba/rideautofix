name: rideautofix
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  http: ^1.2.0
  image_picker: ^1.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Settings for flutter_launcher_icons (top level, NOT under "flutter:")
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpeg"
  web:
    generate: true
    image_path: "assets/logo.jpeg"
    background_color: "#0E1217"
    theme_color: "#4C8DFF"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg